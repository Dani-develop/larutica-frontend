name: DAST ZAP aislado

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL del candidato aislado, nunca producción"
        required: true
        type: string
      allowed_hosts:
        description: "Hosts permitidos separados por coma; opcional para limitar el objetivo"
        required: false
        type: string

permissions:
  contents: read

jobs:
  zap:
    name: ZAP Automation Framework
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZAP_TARGET_URL: ${{ inputs.target_url }}
      ZAP_ALLOWED_HOSTS: ${{ inputs.allowed_hosts }}
      ZAP_USER: ${{ secrets.ZAP_USER }}
      ZAP_PASSWORD: ${{ secrets.ZAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validar objetivo aislado
        run: node scripts/validate-zap-target.mjs "$ZAP_TARGET_URL"

      - name: Comprobar credenciales de prueba
        shell: bash
        run: |
          test -n "$ZAP_USER"
          test -n "$ZAP_PASSWORD"

      - name: Ejecutar plan ZAP
        uses: zaproxy/action-af@v0.3.0
        with:
          plan: .zap/larutica.yaml
          docker_env_vars: |
            ZAP_TARGET_URL
            ZAP_USER
            ZAP_PASSWORD

      - name: Publicar reporte ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: larutica-zap-${{ github.sha }}
          path: zap-reports/
          if-no-files-found: error
          retention-days: 14
