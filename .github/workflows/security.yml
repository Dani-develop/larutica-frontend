name: Analisis de seguridad (3.2)

on:
  pull_request:
    branches: [main, development, seg/2.3-semgrep-gitleaks]
  push:
    branches: [main, development, seg/3.2-analisis-seguridad-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Seguridad - Semgrep, Gitleaks y OSV
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # No npm ci: los analizadores no necesitan ejecutar scripts de dependencias.
      - name: Instalar analizadores con versiones fijas
        id: install
        run: |
          bash scripts/security/install.sh
          bash scripts/security/install-osv.sh
      - name: Probar politica de bloqueo
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:security
      - name: Verificar contexto de coincidencias del 2.3
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run security:context
      - name: Semgrep CE (misma configuracion de 2.3)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run security:code
      - name: Gitleaks (sin allowlist global)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run security:secrets
      - name: OSV-Scanner (incluye dependencias de desarrollo)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run security:deps
      - name: Verificar integridad y completitud de los tres reportes
        if: ${{ !cancelled() }}
        run: npm run security:gate
      - name: Conservar reportes sanitizados del commit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seguridad-${{ github.sha }}-${{ github.run_attempt }}
          path: outputs/security/ci/*.json
          if-no-files-found: error
          retention-days: 14
