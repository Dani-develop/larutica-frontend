name: Analisis de seguridad (3.2)

on:
  pull_request:
    branches: [main, development, seg/2.3-semgrep-gitleaks]
  push:
    branches: [main, development, seg/3.2-analisis-seguridad-ci]
  workflow_dispatch:
  # 7.6: reescaneo semanal (lunes 12:00 UTC = 06:00 en Costa Rica). Los avisos
  # nuevos de OSV aparecen sin que cambie el código; el resultado actualiza un
  # Issue de hallazgos (job reescaneo-hallazgo).
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Seguridad - Semgrep, Gitleaks y OSV
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # Los analizadores no necesitan dependencias; npm ci va al final y sin scripts.
      - name: Instalar analizadores con versiones fijas
        id: install
        run: |
          bash scripts/security/install.sh
          bash scripts/security/install-osv.sh
      - name: Probar politica de bloqueo
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:security
      - name: Semgrep CE (misma configuracion de 2.3)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run security:code
      - name: Gitleaks (sin allowlist global)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run security:secrets
      - name: OSV-Scanner (incluye dependencias de desarrollo)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run security:deps
      # La prueba de H-04 genera el certificado efímero con @peculiar/x509 y
      # reflect-metadata. Se instalan desde el lockfile sin ejecutar scripts de
      # dependencias, para mantener la regla de no correr código de terceros.
      # Va después de Semgrep, Gitleaks y OSV para que node_modules no entre en
      # el árbol que analiza `gitleaks dir .`.
      - name: Instalar dependencias de prueba sin scripts
        id: deps
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verificar contexto de coincidencias del 2.3
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.deps.outcome == 'success' }}
        run: npm run security:context
      - name: Verificar integridad y completitud de los tres reportes
        if: ${{ !cancelled() }}
        run: npm run security:gate
      - name: Conservar reportes sanitizados del commit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seguridad-${{ github.sha }}-${{ github.run_attempt }}
          path: outputs/security/ci/*.json
          if-no-files-found: error
          retention-days: 14

  # 7.6: si el reescaneo programado o manual falla, se abre o actualiza un solo
  # Issue con la etiqueta `security`. Es un hallazgo candidato: una persona lo
  # clasifica con la plantilla de 7.5 (H-NN) antes de darlo por confirmado.
  # Solo este job recibe `issues: write`; el análisis conserva contents: read.
  reescaneo-hallazgo:
    name: Registrar hallazgo del reescaneo
    needs: security
    if: ${{ always() && needs.security.result == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Abrir o actualizar el Issue del reescaneo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          title="Reescaneo programado: hallazgo candidato (7.6)"
          body="El reescaneo (Semgrep, Gitleaks, OSV) falló sobre ${COMMIT}. Corrida: ${RUN_URL}. Descargar el artefacto seguridad-${COMMIT}-N, clasificar cada aviso con la plantilla de 7.5 (H-NN) y enlazarlo aquí. No es un hallazgo confirmado hasta que una persona lo clasifique."
          number=$(gh issue list --state open --label security --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label security --body "$body"
          fi
