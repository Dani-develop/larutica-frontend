name: Comprobaciones post-despliegue

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL HTTPS del despliegue que se validará
        required: true
        type: string
      deployed_commit:
        description: SHA o versión del despliegue que se validará
        required: true
        type: string

permissions:
  contents: read

jobs:
  post-deploy:
    name: Health y smoke post-despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validar inputs
        id: validate-inputs
        env:
          TARGET_URL: ${{ inputs.target_url }}
          DEPLOYED_COMMIT: ${{ inputs.deployed_commit }}
        run: |
          node --input-type=module <<'NODE'
          const targetValue = process.env.TARGET_URL ?? '';
          const deployedCommit = process.env.DEPLOYED_COMMIT ?? '';

          let target;
          try {
            target = new URL(targetValue);
          } catch {
            console.error('target_url debe ser una URL válida.');
            process.exit(1);
          }

          if (
            target.protocol !== 'https:' ||
            !target.hostname ||
            target.username ||
            target.password ||
            targetValue !== targetValue.trim() ||
            /[\u0000-\u001f]/.test(targetValue)
          ) {
            console.error('target_url debe ser HTTPS y no incluir credenciales.');
            process.exit(1);
          }

          if (target.hostname !== 'larutica-cr.vercel.app' || target.port) {
            console.error('target_url debe usar el host oficial https://larutica-cr.vercel.app.');
            process.exit(1);
          }

          if (
            !deployedCommit ||
            deployedCommit !== deployedCommit.trim() ||
            deployedCommit.length > 128 ||
            /[\u0000-\u001f]/.test(deployedCommit)
          ) {
            console.error('deployed_commit debe ser una versión o SHA no vacío.');
            process.exit(1);
          }
          NODE

      - name: Health check HTTP
        id: health
        continue-on-error: true
        env:
          TARGET_URL: ${{ inputs.target_url }}
          DEPLOYED_COMMIT: ${{ inputs.deployed_commit }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/post-deploy
          printf 'target_url=%s\ndate_utc=%s\ndeployed_commit=%s\n' \
            "$TARGET_URL" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$DEPLOYED_COMMIT" > artifacts/post-deploy/health-evidence.txt

          set +e
          http_status="$(curl \
            --silent \
            --show-error \
            --location \
            --fail-with-body \
            --proto '=https' \
            --proto-redir '=https' \
            --max-time 30 \
            --max-redirs 5 \
            --output artifacts/post-deploy/health-response.txt \
            --write-out '%{http_code}' \
            "$TARGET_URL")"
          curl_exit=$?
          set -e

          printf 'http_status=%s\ncurl_exit_code=%s\n' \
            "$http_status" "$curl_exit" >> artifacts/post-deploy/health-evidence.txt

          if [ "$curl_exit" -ne 0 ] || [[ ! "$http_status" =~ ^2[0-9]{2}$ ]]; then
            echo "Health check falló: HTTP $http_status (curl exit $curl_exit)."
            exit 1
          fi

      - name: Instalar dependencias
        id: install
        run: npm ci

      - name: Instalar Chromium
        id: browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test seguro del despliegue
        id: smoke
        continue-on-error: true
        env:
          LARUTICA_TEST_URL: ${{ inputs.target_url }}
          DEPLOYED_COMMIT: ${{ inputs.deployed_commit }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/post-deploy
          printf 'target_url=%s\ndate_utc=%s\ndeployed_commit=%s\ncommand=npm run test:vercel\n' \
            "$LARUTICA_TEST_URL" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$DEPLOYED_COMMIT" > artifacts/post-deploy/smoke-evidence.txt

          set +e
          npm run test:vercel 2>&1 | tee artifacts/post-deploy/smoke-output.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          smoke_exit=${pipeline_status[0]}
          tee_exit=${pipeline_status[1]}

          printf 'smoke_exit_code=%s\ntee_exit_code=%s\n' \
            "$smoke_exit" "$tee_exit" >> artifacts/post-deploy/smoke-evidence.txt

          if [ "$smoke_exit" -ne 0 ]; then
            exit "$smoke_exit"
          fi
          exit "$tee_exit"

      - name: Publicar evidencia health y smoke
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: post-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/post-deploy/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Exigir health check y smoke exitosos
        if: always()
        env:
          INPUTS_OUTCOME: ${{ steps.validate-inputs.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "inputs:$INPUTS_OUTCOME" \
            "health:$HEALTH_OUTCOME" \
            "npm-ci:$INSTALL_OUTCOME" \
            "chromium:$BROWSER_OUTCOME" \
            "smoke:$SMOKE_OUTCOME"; do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [ "$outcome" != "success" ]; then
              echo "$name terminó con estado: $outcome"
              failed=1
            fi
          done
          exit "$failed"
