env:
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
  contexts:
    - name: "LaRutica isolated test"
      urls:
        - "${ZAP_TARGET_URL}"
      includePaths:
        - "${ZAP_TARGET_URL}/.*"
      excludePaths:
        - "${ZAP_TARGET_URL}/api/payments/onvopay/webhook.*"
        - "${ZAP_TARGET_URL}/api/maps/.*"
      authentication:
        method: "json"
        parameters:
          loginPageUrl: "${ZAP_TARGET_URL}/login"
          loginRequestUrl: "${ZAP_TARGET_URL}/api/auth/login"
          loginRequestBody: '{"email":"{%username%}","password":"{%password%}"}'
        verification:
          method: "response"
          loggedInRegex: '\"session\"'
          loggedOutRegex: '\"error\"'
      sessionManagement:
        method: "cookie"
        parameters: {}
      users:
        - name: "zap-test-user"
          credentials:
            username: "${ZAP_USER}"
            password: "${ZAP_PASSWORD}"

jobs:
  - type: "spider"
    parameters:
      context: "LaRutica isolated test"
      user: "zap-test-user"
      maxDuration: 2
      url: "${ZAP_TARGET_URL}/"

  - type: "requestor"
    parameters:
      user: "zap-test-user"
    requests:
      - name: "authenticated session verification"
        url: "${ZAP_TARGET_URL}/api/auth/session"
        method: "GET"
        responseCode: 200
    tests:
      - name: "authenticated session is present"
        type: "url"
        url: "${ZAP_TARGET_URL}/api/auth/session"
        operator: "and"
        responseBodyRegex: '"session"\s*:'
        onFail: "error"

  - type: "passiveScan-wait"
    parameters:
      maxDuration: 2

  - type: "activeScan"
    parameters:
      context: "LaRutica isolated test"
      user: "zap-test-user"
      maxScanDurationInMins: 3
      maxRuleDurationInMins: 1

  - type: "report"
    parameters:
      template: "traditional-html-plus"
      reportDir: "/zap/wrk/zap-reports"
      reportFile: "larutica-zap-report.html"
      reportTitle: "LaRutica isolated DAST"
      reportDescription: "ZAP Automation Framework against an isolated test candidate."

  - type: "exitStatus"
    parameters:
      okExitValue: 0
      warnExitValue: 0
      errorExitValue: 1
