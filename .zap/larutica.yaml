env:
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
  contexts:
    - name: "LaRutica isolated test"
      urls:
        - "${ZAP_TARGET_URL}"
      includePaths:
        - "${ZAP_TARGET_URL}/.*"
      excludePaths:
        - "${ZAP_TARGET_URL}/api/payments/onvopay/webhook.*"
        - "${ZAP_TARGET_URL}/api/maps/.*"

jobs:
  # La sesión se obtiene antes con el login real (workflow, solo cuenta ficticia) y
  # se inyecta como cookie; el valor llega por ZAP_SESSION_COOKIE y no se imprime.
  - type: "replacer"
    parameters:
      deleteAllRules: true
    rules:
      - description: "Sesion autenticada de la cuenta de prueba"
        matchType: "req_header"
        matchString: "Cookie"
        matchRegex: false
        replacementString: "${ZAP_SESSION_COOKIE}"

  - type: "spider"
    parameters:
      context: "LaRutica isolated test"
      maxDuration: 2
      url: "${ZAP_TARGET_URL}/"

  - type: "requestor"
    requests:
      - name: "authenticated session verification"
        url: "${ZAP_TARGET_URL}/api/auth/session"
        method: "GET"
        responseCode: 200
    tests:
      - name: "authenticated session is present"
        type: "url"
        url: "${ZAP_TARGET_URL}/api/auth/session"
        operator: "or"
        responseBodyRegex: '"session"\s*:'
        onFail: "error"

  - type: "passiveScan-wait"
    parameters:
      maxDuration: 2

  - type: "activeScan"
    parameters:
      context: "LaRutica isolated test"
      maxScanDurationInMins: 3
      maxRuleDurationInMins: 1

  - type: "report"
    parameters:
      template: "traditional-html-plus"
      reportDir: "/zap/wrk/zap-reports"
      reportFile: "larutica-zap-report.html"
      reportTitle: "LaRutica isolated DAST"
      reportDescription: "ZAP Automation Framework against an isolated test candidate."

  - type: "exitStatus"
    parameters:
      okExitValue: 0
      warnExitValue: 0
      errorExitValue: 1
